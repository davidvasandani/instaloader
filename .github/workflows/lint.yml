name: PyLint and MyPy

on: [push, pull_request]

jobs:
  lint:
    name: PyLint and MyPy
    # Python 3.9 builds remain available on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout Instaloader Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pipenv'
      - name: Install Dependencies
        run: |
          python -m pip install pipenv==2026.8.0
          pipenv --python `python --version | grep -Eo '3\.[0-9]+'` sync --dev
      - name: Offline fork regression tests
        run: pipenv run python -m unittest discover -s test -p "test_*.py"
      - name: PyLint
        run: pipenv --python `python --version | grep -Eo '3\.[0-9]+'` run pylint instaloader
      - name: MyPy
        run: pipenv --python `python --version | grep -Eo '3\.[0-9]+'` run mypy -m instaloader
